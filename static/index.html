<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI 素材管理器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='8' height='8' rx='2' fill='%237C6CFF'/%3E%3Crect x='13' y='13' width='8' height='8' rx='2' fill='%234CC9F0'/%3E%3Cpath d='M7 11v3a3 3 0 0 0 3 3h3' stroke='%239AA0B4' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }

  /* ===== 全局滚动条 ===== */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #343748; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #4A4E68; }
  ::-webkit-scrollbar-corner { background: transparent; }
  .ftree, .wlist, .filegrid, .pblock {
    scrollbar-width: thin; scrollbar-color: #343748 transparent;
  }
  html, body { background: #131419; }
  body {
    margin: 0; color: #E9EBF2; height: 100vh;
    display: flex; flex-direction: column;
    font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    line-height: 1.5; font-size: 14px;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }

  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; background: #171922; border-bottom: 1px solid #262936;
    position: sticky; top: 0; z-index: 20; flex: 0 0 auto;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .02em; }
  header h1 em { font-style: normal; color: #7C6CFF; }
  header h1 .ver {
    font-size: 11px; font-weight: 600; color: #7FD4F5; vertical-align: 2px;
    background: rgba(76,201,240,.1); border: 1px solid rgba(76,201,240,.28);
    border-radius: 999px; padding: 1px 8px; margin-left: 4px; letter-spacing: 0;
  }
  header .hint { color: #9AA0B4; font-size: 12.5px; margin-left: 4px; }
  header .spacer { flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid #33364A; color: #C7CBD8; background: #1E2029;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #6E7386; }
  .badge.ok .dot { background: #4ADE80; }
  .badge.bad .dot { background: #F87171; }

  /* ===== 顶部导航 ===== */
  .nav { display: flex; gap: 4px; margin-left: 16px; }
  .navbtn {
    background: none; border: 1px solid transparent; color: #9AA0B4;
    padding: 6px 14px; font-size: 13.5px; cursor: pointer; border-radius: 8px; font-family: inherit;
  }
  .navbtn:hover { color: #E9EBF2; }
  .navbtn.on { color: #B7ABFF; background: rgba(124,108,255,.14); border-color: rgba(124,108,255,.4); }

  /* ===== 布局（百分比铺满，兼容各分辨率） ===== */
  .layout {
    display: grid; padding: 16px 20px; gap: 16px;
    flex: 1 1 auto; min-height: 0;
    /* 固定行高：三栏高度受限，内部列表/网格才能触发滚动条，内容多时不会被撑爆 */
    grid-template-rows: minmax(0, 1fr);
  }
  .layout.out { grid-template-columns: 250px 330px minmax(0, 1fr); }
  .layout.single { grid-template-columns: 1fr; }
  @media (max-width: 1180px) {
    .layout.out { grid-template-columns: 220px 280px minmax(0, 1fr); }
  }
  @media (max-width: 960px) {
    body { height: auto; overflow: auto; }
    .layout.out { grid-template-columns: 1fr; }
    .layout.out, .layout.wf, .layout.single { flex: none; height: auto; }
    .panel { height: auto !important; }
    .ftree, .wlist, .filegrid, .mlist { max-height: 55vh !important; flex: none !important; }
    .detail-grid { flex: none !important; }
    .previewbox { min-height: 300px !important; }
  }
  .panel {
    background: #1A1C24; border: 1px solid #262936; border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .panel h2 {
    margin: 0; font-size: 14px; font-weight: 600; color: #C7CBD8;
    display: flex; align-items: center; gap: 8px;
  }
  .result-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; flex: 0 0 auto; }
  .result-head h2 { margin: 0; }
  .result-head .rh-row { display: flex; align-items: center; gap: 8px; }
  .result-head .rh-row + .rh-row { justify-content: flex-end; }
  .result-head .rh-row h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-head .rh-row .btn { white-space: nowrap; flex: 0 0 auto; }
  .result-head .spacer { flex: 1; }
  .stat-line { font-size: 12.5px; color: #8A8FA3; }

  /* ===== 工作流页布局 ===== */
  .layout.wf { grid-template-columns: 340px minmax(0, 1fr); }
  @media (max-width: 960px) { .layout.wf { grid-template-columns: 1fr; } }
  .wlist {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1 1 auto; min-height: 0; overflow: auto; padding-right: 2px;
  }
  .wrow {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: #C7CBD8;
    border: 1px solid transparent;
  }
  .wrow:hover { background: #1E2130; }
  .wrow.on { background: rgba(124,108,255,.14); border-color: rgba(124,108,255,.35); }
  .wrow .wn { flex: 1; min-width: 0; }
  .wrow .wn b { font-weight: 600; color: #E9EBF2; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .wn span { display: block; font-size: 11.5px; color: #6E7386; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .wt { font-size: 11.5px; color: #6E7386; flex: 0 0 auto; white-space: nowrap; }
  .minihead { font-size: 12px; color: #8A8FA3; margin: 12px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12.5px; padding: 4px 11px; border-radius: 999px;
    background: #23252F; border: 1px solid #33364A; color: #C7CBD8; font-family: inherit;
  }
  .selchips .chip { cursor: default; }
  .selchips .chip .x { cursor: pointer; margin-left: 6px; color: #8A8FA3; }
  .selchips .chip .x:hover { color: #F87171; }
  .comborow { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .comborow .btn { flex: 0 0 auto; }

  /* ===== 控件 ===== */
  .btn {
    font-family: inherit; font-size: 13px; color: #E9EBF2; cursor: pointer;
    background: #23252F; border: 1px solid #33364A; border-radius: 8px;
    padding: 7px 14px;
  }
  .btn:hover { border-color: #4A4E68; background: #2A2D3A; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; }
  .btn.primary { background: #7C6CFF; border-color: #7C6CFF; color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #8D7FFF; border-color: #8D7FFF; }
  input[type=text], select {
    width: 100%; background: #12141B; border: 1px solid #2E3140; color: #E9EBF2;
    border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 13px; outline: none;
  }
  input:focus, select:focus { border-color: #7C6CFF; }
  .toolrow { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolrow input { flex: 1; min-width: 120px; }
  .toolrow select { flex: 0 0 auto; }

  /* ===== 文件夹树（可折叠） ===== */
  .ftree {
    display: flex; flex-direction: column; gap: 1px;
    flex: 1 1 auto; min-height: 0; overflow: auto; padding-right: 2px;
  }
  .frow {
    display: flex; align-items: flex-start; gap: 6px; padding: 6px 8px;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: #C7CBD8;
  }
  .frow:hover { background: #1E2130; }
  .frow.on { background: rgba(124,108,255,.14); color: #E9EBF2; }
  .frow .fn { overflow: visible; white-space: normal; word-break: break-all; flex: 1; min-width: 0; line-height: 1.35; }
  .frow .fc { font-size: 11px; color: #6E7386; flex: 0 0 auto; white-space: nowrap; }
  .frow.on .fc { color: #9AA0B4; }
  .frow.root > .fn { color: #EFF2FA; font-weight: 600; }
  .frow .root-tag {
    flex: 0 0 auto; margin-left: 2px; padding: 1px 7px; border-radius: 10px;
    font-size: 10.5px; font-weight: 600; color: #0B0E16; background: #3DA9F5;
    white-space: nowrap;
  }
  .mbadge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 10px;
    font-size: 10.5px; font-weight: 600; color: #0B0E16; background: #3DA9F5;
    white-space: nowrap; vertical-align: 1px; line-height: 1.4;
  }
  .frow .tw {
    width: 16px; flex: 0 0 16px; display: inline-flex; align-items: center; justify-content: center;
    color: #8A8FA3; font-size: 10px; user-select: none;
  }
  .frow .tw.open { transform: rotate(0deg); }
  .frow .tw.closed { transform: rotate(-90deg); }
  .frow .tw.leaf { visibility: hidden; }
  .ftree .fgroup { display: flex; flex-direction: column; gap: 1px; }

  /* ===== 文件网格 ===== */
  .filegrid {
    display: grid; grid-template-columns: repeat(auto-fill, 192px);
    grid-auto-rows: max-content;
    justify-content: start;
    gap: 10px; flex: 1 1 auto; min-height: 0; overflow: auto; padding-right: 2px;
    align-content: start;
  }
  .btn.tog { border-color: #2E7D32; color: #81C784; }
  .btn.tog.off { border-color: #3A3F50; color: #6E7386; }

  /* 比例多选按钮 */
  .ratio-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0 2px; }
  .ratio-label { color: #6E7386; font-size: 12px; margin-right: 2px; }
  .rbtn { background: #232836; color: #C6C9D6; border: 1px solid #3A3F50; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .rbtn:hover { background: #2B3140; }
  .rbtn.on { background: #2E6BD6; color: #fff; border-color: #2E6BD6; }
  .rbtn.rclear { color: #9AA0B4; }
  .rbtn.rclear:hover { background: #3A2630; color: #E58; }

  /* 全图预览 lightbox */
  .lightbox { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .lightbox .lb-bg { position: absolute; inset: 0; background: rgba(5,7,12,.94); }
  .lightbox .lb-body { position: relative; display: flex; flex-direction: column; align-items: center; max-width: 94vw; max-height: 94vh; }
  .lightbox .lb-info { color: #9AA0B4; font-size: 13px; text-align: center; padding: 6px 0 10px; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lightbox .lb-media { display: flex; align-items: center; justify-content: center; }
  .lightbox .lb-img { max-width: 92vw; max-height: 84vh; object-fit: contain; border-radius: 4px; cursor: zoom-out; }
  .lightbox .lb-v { max-width: 92vw; max-height: 84vh; }
  .lightbox .lb-close { position: absolute; top: -4px; right: -30px; color: #C6C9D6; font-size: 24px; cursor: pointer; background: none; border: none; line-height: 1; }
  .lightbox .lb-close:hover { color: #fff; }
  .lightbox .lb-nav button { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.07); color: #E6E8F0; border: 1px solid rgba(255,255,255,.12); font-size: 32px; width: 54px; height: 80px; border-radius: 10px; cursor: pointer; }
  .lightbox .lb-nav button:hover { background: rgba(255,255,255,.16); }
  .lightbox .lb-nav .lb-prev { left: -70px; }
  .lightbox .lb-nav .lb-next { right: -70px; }
  .fcell { border: 1px solid #262936; border-radius: 8px; overflow: hidden; background: #101118; cursor: pointer; align-self: start; }
  .fcell:hover { border-color: #4A4E68; }
  .fcell.on { border-color: #7C6CFF; box-shadow: 0 0 0 1px #7C6CFF inset; }
  .fcell .th {
    height: var(--th-h, 200px); min-height: 100px; background: linear-gradient(135deg, #14161E, #0C0D12); display: flex;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden; transition: height .12s ease;
  }
  .fcell .th .fg {
    position: relative; z-index: 1; width: 100%; height: 100%;
    object-fit: contain; object-position: center; display: block; border-radius: 4px;
  }
  .fcell .th.lding::after {
    content: "加载中…"; position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #6E7386; pointer-events: none;
  }
  .fcell .th.er::after {
    content: "缩略图不可用"; position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #6E7386; pointer-events: none;
  }
  .fcell .th .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(233,235,242,.92); z-index: 3; pointer-events: none;
  }
  .fcell .nm { padding: 4px 6px; font-size: 11.5px; color: #9AA0B4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== 详情（三分） ===== */
  .detail-grid {
    display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 14px;
    flex: 1 1 auto; min-height: 0;
  }
  .detail-grid > div { min-width: 0; min-height: 0; }
  .detail-grid > :last-child { display: flex; flex-direction: column; }
  @media (max-width: 720px) { .detail-grid { grid-template-columns: 1fr; } }
  .dsub h3 {
    margin: 0 0 8px; font-size: 12.5px; font-weight: 600; color: #C7CBD8;
    display: flex; align-items: center; gap: 8px;
  }
  .dsub h3 .bar { width: 3px; height: 13px; border-radius: 2px; background: #7C6CFF; }
  .kvrow { display: flex; gap: 10px; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed #23252F; }
  .kvrow:last-child { border-bottom: none; }
  .kvrow .k { color: #8A8FA3; flex: 0 0 76px; }
  .kvrow .v { color: #E9EBF2; word-break: break-all; min-width: 0; }
  .kvrow .v.badged { display: flex; align-items: center; gap: 8px; }
  .kvrow .v.badged .vname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kvrow .v.badged .vbadges { flex: 0 0 auto; display: inline-flex; gap: 6px; }
  .kvrow .v.badged { display: flex; align-items: center; gap: 8px; }
  .kvrow .v.badged .vname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kvrow .v.badged .vbadges { flex: 0 0 auto; display: inline-flex; gap: 6px; }
  .pblock {
    background: #101118; border: 1px solid #262936; border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px; color: #C7CBD8;
    white-space: pre-wrap; word-break: break-word;
    position: relative;
  }
  .pblock.collapsed { max-height: 116px; overflow: hidden; }
  .pblock.collapsed::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    background: linear-gradient(transparent, #101118);
  }
  .pblock.expanded { max-height: none; overflow: visible; }
  .pb-actions { display: flex; gap: 6px; margin-top: 6px; }
  .pb-toggle {
    flex: 1; padding: 3px 0;
    background: none; border: 1px solid transparent; color: #7C6CFF; font-size: 12px;
    cursor: pointer; font-family: inherit; text-align: center; border-radius: 6px;
  }
  .pb-toggle:hover { color: #B7ABFF; background: rgba(124,108,255,.08); }
  .pb-copy {
    flex: 0 0 auto; padding: 3px 14px;
    background: #23252F; border: 1px solid #33364A; color: #C7CBD8; font-size: 12px;
    cursor: pointer; font-family: inherit; border-radius: 6px;
  }
  .pb-copy:hover { border-color: #4A4E68; color: #B7ABFF; }
  .pblock.empty-text { color: #5B6074; font-style: italic; }
  .prompt-empty { font-size: 12.5px; color: #6E7386; font-style: italic; }

  /* ===== 栏宽拖拽分隔条 ===== */
  .layout.out { position: relative; }
  .grip {
    position: absolute; top: 0; bottom: 0; width: 9px;
    cursor: col-resize; z-index: 6; user-select: none;
  }
  .grip::after {
    content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px;
    background: transparent; transition: background .15s, width .15s, left .15s;
  }
  .grip:hover::after, .grip.drag::after { background: #7C6CFF; width: 2px; left: 3.5px; }
  .grip.collapsed {
    width: 18px; height: 54px; top: 50%; transform: translateY(-50%); bottom: auto;
    background: rgba(124,108,255,.14); border: 1px solid rgba(124,108,255,.35);
    border-radius: 0 9px 9px 0; display: flex; align-items: center; justify-content: center;
  }
  .grip.collapsed[data-idx="1"] { border-radius: 9px 0 0 9px; }
  .grip.collapsed::after { display: none; }
  .grip.collapsed::before {
    content: "\25B6"; font-size: 11px; color: #C9BFFF; line-height: 1;
  }
  .grip.collapsed[data-idx="1"]::before { content: "\25C0"; }
  .grip.collapsed:hover { background: rgba(124,108,255,.30); border-color: rgba(124,108,255,.6); }
  .grip.collapsed:hover::before { color: #fff; }
  .panel.collapsed { overflow: hidden; }
  .panel.collapsed > * { opacity: 0; }
  @media (max-width: 960px) { .grip { display: none; } }
  .colcollapse {
    background: transparent; border: none; color: #6E7386; cursor: pointer;
    font-size: 11px; padding: 1px 6px 2px; margin-left: 5px; border-radius: 6px;
    line-height: 1.2; vertical-align: middle; font-family: inherit;
  }
  .colcollapse:hover { color: #C9BFFF; background: rgba(124,108,255,.12); }

  .note { font-size: 12.5px; color: #6E7386; padding: 10px 2px; }
  .previewbox {
    background: #101118; border: 1px solid #262936; border-radius: 10px;
    flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; padding: 10px;
  }
  .bigmedia { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; margin: auto; }
  video.bigmedia { background: #000; width: 100%; max-height: 100%; }

  /* ===== 工作流详情（两列：左信息 / 右插件 + 最近生成参考） ===== */
  #wd_body { flex: 1 1 auto; min-height: 0; overflow: auto; padding-right: 2px; }
  .wfd {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px;
    min-height: 100%; align-items: stretch;
  }
  .wfd > div { min-width: 0; min-height: 0; }
  .wfd > :last-child { display: flex; flex-direction: column; }
  @media (max-width: 1280px) { .wfd { grid-template-columns: 1fr; } }
  .nodechips { display: flex; flex-wrap: wrap; gap: 6px; }
  .nodechips .nchip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 8px;
    background: #1E2130; border: 1px solid #33364A; color: #C7CBD8;
    max-width: 100%; overflow: hidden;
  }
  .nodechips .nchip .nname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nodechips .nchip .nx { flex: 0 0 auto; font-size: 10.5px; color: #6E7386; }
  .nodechips .nchip.miss { border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.12); }
  .nodechips .nchip.miss .nname { color: #FCA5A5; }
  .nodechips .nchip.miss .nx { color: #F87171; }
  .nodechips .nchip.plug { border-color: rgba(76,201,240,.35); background: rgba(76,201,240,.08); }
  .nodechips .nchip.plug .nname { color: #7FD4F5; }
  .nodechips .nchip.built { border-color: #33364A; }
  .wfref {
    margin-top: 14px; border: 1px solid #262936; border-radius: 10px;
    background: #101118; overflow: hidden; cursor: pointer;
    flex: 1 1 0; display: flex; flex-direction: column; min-height: 200px;
  }
  .wfref .rth {
    background: #0C0D12; display: flex; align-items: center; justify-content: center;
    padding: 10px; flex: 0 0 auto; min-height: 80px;
  }
  .wfref .rth img { max-width: 100%; max-height: 300px; width: auto; height: auto; object-fit: contain; border-radius: 6px; }
  .wfref .rinfo {
    padding: 8px 10px; font-size: 12px; color: #9AA0B4; display: flex; gap: 8px; align-items: center;
    border-top: 1px solid #1E2130; flex: 0 0 auto;
  }
  .wfref .rinfo b { color: #E9EBF2; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wfref:hover { border-color: #4A4E68; }
  .wfref .rth img { animation: wffade .3s ease; }
  @keyframes wffade { from { opacity: .25; } to { opacity: 1; } }
  .wfref .wfhist {
    display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #1E2130;
    overflow-x: auto; flex: 0 0 auto; cursor: default;
  }
  .wfref .whitem {

<header>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  /* ================= 通用工具 ================= */
  function toast(msg, isErr) {
    var t = $("toast");
    t.textContent = msg;
    t.className = isErr ? "err show" : "show";
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.className = ""; }, 2600);
  }
  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }
  function debounce(fn, ms) {
    var t = null;
    return function () {
      clearTimeout(t);
      t = setTimeout(fn, ms);
    };
  }
  function fmtSize(n) {
    if (n == null) return "-";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }
  function fmtTime(t) {
    var d = new Date(t * 1000), p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
      p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function mediaUrl(path, thumb) {
    return "/media?path=" + encodeURIComponent(path) + (thumb ? "&thumb=1" : "");
  }
  function postJSON(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); });
  }
  function confirmDelete(btn, path, after) {
    if (btn.dataset.arm !== "1") {
      btn.dataset.arm = "1";
      btn.textContent = "确认删除？";
      btn.style.borderColor = "#F87171";
      setTimeout(function () {
        btn.dataset.arm = "";
        btn.textContent = "删除";
        btn.style.borderColor = "";
      }, 4000);
      return;
    }
    postJSON("/api/storage/delete", { path: path }).then(function (d) {
      if (d.error) throw new Error(d.error);
      toast("已删除");
      after();
    }).catch(function (e) { toast("删除失败: " + e.message, true); });
  }
  function openFolder(path) {
    postJSON("/api/storage/open", { path: path }).then(function (d) {
      if (d.error) toast(d.error, true);

  function confirmRmdir(btn, path, after) {

  /* ================= 存储目录配置 ================= */
  var storageCfg = { model_dirs: [], output_dirs: [], workflow_dirs: [],
                     output_excludes: [], series_filter: { pattern: "", exclude: [] } };
  function loadStorageConfig() {
    return fetch("/api/storage/config").then(function (r) { return r.json(); }).then(function (d) {
      storageCfg = d;
      if (!storageCfg.output_excludes) storageCfg.output_excludes = [];
      if (!storageCfg.series_filter) storageCfg.series_filter = { pattern: "", exclude: [] };
      renderStorageDirs();
    }).catch(function () {});
  }
  function saveStorageConfig() {
    return postJSON("/api/storage/config", storageCfg).then(function (d) {
      if (d.error) throw new Error(d.error);
      return d;
    });
  }
  function renderStorageDirs() {

    m.innerHTML = "";
    storageCfg.model_dirs.forEach(function (d, i) {

      chip.className = "chip";
      chip.innerHTML = '<span class="mono" style="font-size:12px">' + esc(d) + '</span><span class="x">×</span>';
      chip.querySelector(".x").addEventListener("click", function () {
        storageCfg.model_dirs.splice(i, 1);
        saveStorageConfig().then(function () { renderStorageDirs(); loadModels(); })
          .catch(function (e) { toast(e.message, true); });
      });
      m.appendChild(chip);

    if (!storageCfg.model_dirs.length) m.innerHTML = '<span style="font-size:12.5px;color:#6E7386">尚未配置模型目录</span>';
    var w = $("w_dirs");
    w.innerHTML = "";
    storageCfg.workflow_dirs.forEach(function (d, i) {
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = '<span class="mono" style="font-size:12px">' + esc(d) + '</span><span class="x">×</span>';
      chip.querySelector(".x").addEventListener("click", function () {
        storageCfg.workflow_dirs.splice(i, 1);
        saveStorageConfig().then(function () { renderStorageDirs(); loadWorkflows(); })
          .catch(function (e) { toast(e.message, true); });
      });
      w.appendChild(chip);
    });
    if (!storageCfg.workflow_dirs.length) w.innerHTML = '<span style="font-size:12.5px;color:#6E7386">尚未配置工作流目录</span>';

    /* 输出排除子目录 */
    var ex = $("o_excl");
    ex.innerHTML = "";
    storageCfg.output_excludes.forEach(function (e, i) {
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = '<span class="mono" style="font-size:12px">' + esc(e) + '</span><span class="x">×</span>';
      chip.querySelector(".x").addEventListener("click", function () {
        storageCfg.output_excludes.splice(i, 1);
        saveStorageConfig().then(function () { renderStorageDirs(); reloadOutputAll(); })
          .catch(function (e2) { toast(e2.message, true); });
      });
      ex.appendChild(chip);
    });
    if (!storageCfg.output_excludes.length) ex.innerHTML = '<span style="font-size:12.5px;color:#6E7386">未排除任何子目录</span>';

    /* 模型系列：排除列表 + 正则 */
    var mex = $("m_excl");
    mex.innerHTML = "";
    storageCfg.series_filter.exclude.forEach(function (e, i) {
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = '<span class="mono" style="font-size:12px">' + esc(e) + '</span><span class="x">×</span>';
      chip.querySelector(".x").addEventListener("click", function () {
        storageCfg.series_filter.exclude.splice(i, 1);
        saveStorageConfig().then(function () { renderStorageDirs(); loadModels(); })
          .catch(function (e2) { toast(e2.message, true); });
      });
      mex.appendChild(chip);
    });
    if (!storageCfg.series_filter.exclude.length) mex.innerHTML = '<span style="font-size:12.5px;color:#6E7386">未排除任何系列</span>';

  /* ================= 视图切换 ================= */
  function switchView(name) {
    ["outputs", "workflows", "models"].forEach(function (v) {
      var el = $("view-" + v);
      if (el) el.style.display = (v === name) ? "" : "none";
    });
    document.querySelectorAll(".navbtn").forEach(function (b) {
      b.classList.toggle("on", b.dataset.view === name);
    });
    if (name === "outputs") { loadOutputFolders(); loadFiles(); }
    if (name === "workflows") { loadWorkflowFolders(); loadWorkflows(); }
    if (name === "models") loadModels();
    /* 记录当前页，刷新后保持不跳转 */
    try { history.replaceState(null, "", "#" + name); } catch (e) {}
  }
  document.querySelectorAll(".navbtn").forEach(function (b) {
    b.addEventListener("click", function () { switchView(b.dataset.view); });
  });

  /* ================= 输出管理（三分式） ================= */
  var _oc = loadCollapsed("cfm_out_collapsed");
  var oState = {
    folders: [], selFolder: "", collapsed: _oc !== null ? _oc : null,
    files: [], selFile: null,
    q: "", sort: "new", kind: "all", ratio: []
  };

  function reloadOutputAll() {
    oState.selFolder = "";
    oState.selFile = null;
    oState.collapsed = {};
    saveCollapsed("cfm_out_collapsed", {});
    loadOutputFolders();
    loadFiles();
  }

  function loadOutputFolders() {
    fetch("/api/output_folders").then(function (r) { return r.json(); }).then(function (d) {
      oState.folders = d || [];
      renderFolderTree();
      if (oState.folders.length && !oState.selFolder) {
        oState.selFolder = oState.folders[0].path;
        renderFolderTree();
        loadFiles();
      }
    }).catch(function (e) { toast("文件夹扫描失败: " + e, true); });
  }

  function parentPathOf(p) {
    var i = String(p).lastIndexOf("\\");
    return i > 0 ? String(p).slice(0, i) : "";
  }

  function loadCollapsed(key) {
    try { var v = JSON.parse(localStorage.getItem(key)); if (v && typeof v === "object") return v; } catch (e) {}
    return null;
  }
  function saveCollapsed(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj || {})); } catch (e) {}
  }

  /* 收集所有「有子节点」的路径（用于全部收起/展开） */
  function collectBranchPaths(nodes) {
    var has = {};
    nodes.forEach(function (n) {
      var pp = parentPathOf(n.path);
      if (pp) has[pp] = 1;
    });
    return Object.keys(has);
  }

  /* 通用可折叠文件夹树：nodes 需含 path/name/depth，state.collapsed 记录收起路径 */
  function renderTree(box, nodes, state, opts) {
    box.innerHTML = "";
    if (!nodes.length) {
      box.innerHTML = '<div class="empty">' + esc(opts.emptyText || "没有目录") + "</div>";
      return;
    }
    var parentMap = {};
    nodes.forEach(function (n) { parentMap[n.path] = parentPathOf(n.path); });
    function hasChildren(n) {
      return nodes.some(function (x) { return x.depth > n.depth && parentMap[x.path] === n.path; });
    }
    function renderNode(n, container) {
      var row = document.createElement("div");
      row.className = "frow" + (n.depth === 0 ? " root" : "") + (opts.isSel && opts.isSel(n.path) ? " on" : "");
      var hasC = hasChildren(n);
      var tw = '<span class="tw' + (hasC ? (state.collapsed[n.path] ? " closed" : " open") : " leaf") + '">▼</span>';
      var cnt = opts.count ? opts.count(n) : "";
      var fc = cnt ? '<span class="fc">' + cnt + "</span>" : "";
      var tag = n.depth === 0 ? '<span class="root-tag">主目录</span>' : "";
      row.innerHTML = tw + '<span class="fn" title="' + esc(n.path) + '">' + esc(n.name) + "</span>" + tag + fc;
      row.style.paddingLeft = (8 + n.depth * 14) + "px";
      row.querySelector(".tw").addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (!hasC) return;
        if (state.collapsed[n.path]) delete state.collapsed[n.path];
        else state.collapsed[n.path] = 1;
        if (opts.storageKey) saveCollapsed(opts.storageKey, state.collapsed);
        renderTree(box, nodes, state, opts);
      });
      row.addEventListener("click", function () { opts.onSelect(n); });
      container.appendChild(row);
      if (hasC && !state.collapsed[n.path]) {
        var group = document.createElement("div");
        group.className = "fgroup";
        nodes.filter(function (x) { return x.depth > n.depth && parentMap[x.path] === n.path; })
          .forEach(function (c) { renderNode(c, group); });
        container.appendChild(group);
      }
    }
    nodes.filter(function (n) { return n.depth === 0; }).forEach(function (n) { renderNode(n, box); });
  }

  function renderFolderTree() {
    /* 默认全部收起：仅首次渲染（无折叠记录）时把所有分支路径加入折叠并记忆 */
    if (!oState._treeInit) {
      oState._treeInit = true;
      if (oState.collapsed === null) {
        oState.collapsed = {};
        collectBranchPaths(oState.folders).forEach(function (p) { oState.collapsed[p] = 1; });
        saveCollapsed("cfm_out_collapsed", oState.collapsed);
      }
    }
    var box = $("folderTree");
    renderTree(box, oState.folders, oState, {
      storageKey: "cfm_out_collapsed",
      emptyText: "没有输出目录，请在「目录设置」中添加",
      isSel: function (p) { return p === oState.selFolder; },
      count: function (n) {
        if (!n.images && !n.videos) return "";
        return n.images + "图" + (n.videos ? "/" + n.videos + "视频" : "");
      },
      onSelect: function (n) {
        oState.selFolder = n.path;
        oState.selFile = null;
        renderFolderTree();
        loadFiles();
      }
    });
  }

  function loadFiles(silent) {
    var url = "/api/outputs?sort=" + oState.sort + "&kind=" + oState.kind +
      (oState.q ? "&q=" + encodeURIComponent(oState.q) : "") +
      (oState.selFolder ? "&folder=" + encodeURIComponent(oState.selFolder) : "") +
      (oState.ratio.length ? "&ratio=" + encodeURIComponent(oState.ratio.join(",")) : "");
    if (!silent) $("fileList").innerHTML = '<div class="wait">加载中…</div>';
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error);
      oState.files = d || [];
      renderFileList();
      var keep = oState.selFile &&
        oState.files.some(function (f) { return f.path === oState.selFile.path; });
      if (!keep) {
        oState.selFile = oState.files.length ? oState.files[0] : null;
      }
      renderDetail();
      $("o_files_stats").textContent = oState.files.length + " 个文件";
      $("folderInfo").textContent = oState.selFolder ? oState.selFolder : "（未选择文件夹）";
    }).catch(function (e) { toast("加载失败: " + e, true); });
  }

  function renderFileList() {
    var grid = $("fileList");
    grid.innerHTML = "";
    if (!oState.files.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">没有匹配的文件</div>';
      return;
    }
    oState.files.forEach(function (it) {
      var cell = document.createElement("div");
      cell.className = "fcell" + (oState.selFile && oState.selFile.path === it.path ? " on" : "");
      var th = document.createElement("div");
      th.className = "th";
      if (it.kind === "video") {
        var sv = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg>';
        th.style.height = "107px"; /* 16:9 画框：190 * 9/16 */
        th.classList.add("lding");
        th.innerHTML = '<img class="fg" src="' + mediaUrl(it.path, true) + '" alt="' + esc(it.name) + '">' + '<span class="play">' + sv + "</span>";
        var fg = th.querySelector(".fg");
        var done = function () { th.classList.remove("lding"); };
        if (fg.complete) done();
        else fg.addEventListener("load", done);
        fg.addEventListener("error", function () {
          th.classList.remove("lding");
          var im = th.querySelector(".fg"); if (im) im.remove();
        });
      } else {
        th.classList.add("lding");
        /* 高度自适应：网格列固定 192px（减去 2px 边框后图区为 190px），
           按图片真实比例精确设格子高度 → 完整显示、不留白、不裁切 */
        if (oState._thDim && oState._thDim[it.path]) th.style.height = oState._thDim[it.path];
        th.innerHTML = '<img class="fg" src="' + mediaUrl(it.path, true) + '" alt="' + esc(it.name) + '">';
        var fg = th.querySelector(".fg");
        var fit = function () {
          var w = fg.naturalWidth, h = fg.naturalHeight;
          if (w && h) {
            var hh = Math.max(100, Math.round(190 * h / w)) + "px";
            th.style.height = hh;
            if (!oState._thDim) oState._thDim = {};
            oState._thDim[it.path] = hh;
          }
        };
        var done = function () { th.classList.remove("lding"); };
        /* 缓存命中时 load 事件可能在监听前已触发：complete 则直接显示 */
        if (fg.complete) { done(); fit(); }
        else fg.addEventListener("load", function () { done(); fit(); });
        fg.addEventListener("error", function () {
          th.classList.remove("lding");
          th.classList.add("er");
        });
      }
      cell.appendChild(th);
      cell.addEventListener("click", function () { selectFile(it); });
      cell.addEventListener("dblclick", function () { openLightbox(it); });
      grid.appendChild(cell);
    });
  }

  function selectFile(it) {
    oState.selFile = it;
    renderFileList();
    renderDetail();
  }

  function renderDetail() {
    var it = oState.selFile;
    $("od_open").disabled = !it;
    $("od_del").disabled = !it;
    if (!it) {
      $("previewArea").innerHTML = '<div class="empty">选择左侧文件查看详情</div>';
      $("metaParams").innerHTML = '<div class="note">未选择文件</div>';
      $("metaPrompts").innerHTML = "";
      return;
    }
    renderPreview(it);
    $("metaParams").innerHTML = '<div class="wait" style="padding:16px 0">读取参数中…</div>';
    $("metaPrompts").innerHTML = "";
    if (it.kind === "video") {
      $("metaParams").innerHTML = '<div class="wait" style="padding:16px 0">读取视频信息中…</div>';
      fetch("/api/output_video_info?path=" + encodeURIComponent(it.path))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var extra = "";
          if (d && d.found && d.info) {
            var v = d.info, rows = [];
            if (v.duration != null) {
              var du = Math.round(v.duration), s = du % 60, m = Math.floor(du / 60) % 60, h = Math.floor(du / 3600);
              rows.push(["时长", (h > 0 ? h + ":" : "") + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s]);
            }
            if (v.width && v.height) rows.push(["分辨率", v.width + " × " + v.height]);
            if (v.codec) rows.push(["编码", v.codec]);
            extra = '<div class="dsub" style="margin-top:14px"><h3><span class="bar"></span>视频信息</h3>' + kvHTML(rows) + "</div>";
          }
          $("metaParams").innerHTML =
            '<div class="note">视频不支持读取生成参数元数据（MP4/WebM 无内嵌提示词区）</div>' +
            extra + '<div class="dsub" style="margin-top:14px"><h3><span class="bar"></span>文件信息</h3>' + fileInfoRows(it) + "</div>";
        })
        .catch(function () {
          $("metaParams").innerHTML = '<div class="note">视频不支持读取生成参数元数据</div>' + fileInfoRows(it);
        });
      return;
    }
    fetch("/api/output_meta?path=" + encodeURIComponent(it.path))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) {
          $("metaParams").innerHTML = '<div class="note">' + esc(d.error) + "</div>" + fileInfoRows(it);
          return;
        }
        if (!d.found) {
          $("metaParams").innerHTML = '<div class="note">' + esc(d.error || "无参数元数据") + "</div>" + fileInfoRows(it);
          return;
        }
        $("metaParams").innerHTML = metaRows(it, d.params);
        setPromptBlocks($("metaPrompts"), d.params);
      })
      .catch(function (e) {
        $("metaParams").innerHTML = '<div class="note">读取失败: ' + esc(e) + "</div>" + fileInfoRows(it);
      });
  }

  function fileInfoRows(it) {
    var rows = [
      ["文件名", it.name],
      ["大小", fmtSize(it.size)],
      ["修改时间", fmtTime(it.mtime)],
      ["所在文件夹", it.root]
    ];
    return kvHTML(rows);
  }
  function kvHTML(rows, html, vcls) {
    return rows.map(function (r) {
      return '<div class="kvrow"><span class="k">' + esc(r[0]) + '</span><span class="v' +
        (vcls ? " " + vcls : "") + '">' +
        (html ? r[1] : esc(r[1])) + "</span></div>";
    }).join("");
  }
  function mb(text) {
    return '<span class="mbadge">' + esc(text) + "</span>";
  }

  function openLightbox(it, list) {

      + '<button class="lb-close" title="关闭 (ESC)">✕</button></div>';

      var folders = res[0] || [], files = res[1] || [];

      var fChanged = fs !== oAuto.fsig, ffChanged = ffs !== oAuto.ffsig;

  function nodeChipsHTML(list, isCustom) {
    if (!list || !list.length) return "";
    return '<div class="minihead" style="margin-top:6px">' + (isCustom ? "自定义节点（插件）" : "ComfyUI 内置节点") + "</div>" +
      '<div class="nodechips">' + list.map(function (n) {
        var cls = n.missing ? "miss" : (isCustom ? "plug" : "built");
        return '<span class="nchip ' + cls + '" title="' + esc(n.name) + '"><span class="nname">' +
          esc(n.name) + '</span><span class="nx">×' + n.count + "</span></span>";
      }).join("") + "</div>";
  }

  /* ---- 工作流详情 tab：笔记（Note / MarkdownNote 读取与编辑保存） ---- */
  function mdToHtml(src) {
    if (!src || !src.trim()) return '<span style="color:#6E7386">（该笔记内容为空）</span>';
    var lines = src.replace(/\r\n/g, "\n").split("\n");
    var out = [], i = 0;
    var inline = function (s) {
      s = esc(s);
      var codes = [];
      s = s.replace(/`([^`]+)`/g, function (m, c) { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; });
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
        if (/^(https?:|mailto:)/i.test(u)) return '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>";
        return t;
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
      s = s.replace(/\*([^*]+)\*/g, "<i>$1</i>");
      s = s.replace(/\u0001(\d+)\u0001/g, function (m, k) { return "<code>" + codes[+k] + "</code>"; });
      return s;
    };
    while (i < lines.length) {
      var ln = lines[i];
      if (/^```/.test(ln)) {
        var buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(esc(lines[i])); i++; }
        i++;
        out.push('<pre class="ntcode"><code>' + buf.join("\n") + "</code></pre>");
        continue;
      }
      if (ln.indexOf("|") >= 0 && i + 1 < lines.length &&
          /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf("-") >= 0) {
        var escP = function (s) { return s.replace(/\\\|/g, "\u0002"); };
        var unP = function (s) { return s.replace(/\u0002/g, "|"); };
        var cells = escP(ln).split("|");
        if (cells.length && cells[0].trim() === "") cells.shift();
        if (cells.length && cells[cells.length - 1].trim() === "") cells.pop();
        var head = cells.map(function (c) { return unP(c).trim(); });
        var rows = [];
        i += 2;
        while (i < lines.length && lines[i].indexOf("|") >= 0) {
          var rc = escP(lines[i]).split("|");
          if (rc.length && rc[0].trim() === "") rc.shift();
          if (rc.length && rc[rc.length - 1].trim() === "") rc.pop();
          rows.push(rc.map(function (c) { return unP(c).trim(); }));
          i++;
        }
        var t = '<div class="nttblwrap"><table><thead><tr>' +
          head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") +
          "</tr></thead><tbody>";
        rows.forEach(function (r) {
          t += "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        });
        out.push(t + "</tbody></table></div>");
        continue;
      }
      var h = ln.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        var lv = h[1].length;
        out.push("<h" + lv + ">" + inline(h[2]) + "</h" + lv + ">");
        i++;
        continue;
      }
      if (/^>\s?/.test(ln)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(inline(lines[i].replace(/^>\s?/, ""))); i++; }
        out.push("<blockquote>" + q.join("<br>") + "</blockquote>");
        continue;
      }
      var ulm = ln.match(/^[-*+]\s+(.*)$/);
      if (ulm) {
        var items = [];
        while (i < lines.length) {
          var m2 = lines[i].match(/^[-*+]\s+(.*)$/);
          if (!m2) break;
          items.push("<li>" + inline(m2[1]) + "</li>");
          i++;
        }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }
      var olm = ln.match(/^\d+\.\s+(.*)$/);
      if (olm) {
        var oitems = [];
        while (i < lines.length) {
          var m3 = lines[i].match(/^\d+\.\s+(.*)$/);
          if (!m3) break;
          oitems.push("<li>" + inline(m3[1]) + "</li>");
          i++;
        }
        out.push("<ol>" + oitems.join("") + "</ol>");
        continue;
      }
      if (!ln.trim()) { i++; continue; }
      var para = [];
      while (i < lines.length && lines[i].trim()) {
        var tl = lines[i].trim();
        if (/^```/.test(tl) || tl.indexOf("|") >= 0 || /^(#{1,4})\s/.test(tl) ||
            /^>\s?/.test(tl) || /^[-*+]\s+/.test(tl) || /^\d+\.\s+/.test(tl)) break;
        para.push(tl);
        i++;
      }
      if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>");
      else i++;
    }
    return out.join("\n");
  }

  function renderNotes(notes, path) {
    if (!notes.length) return;
    notes.forEach(function (nt, i) {
      var pane = $("wdpaneN" + i);
      if (!pane) return;
      var label = nt.title || (nt.type + (nt.id != null ? " #" + nt.id : ""));
      var isMd = nt.type === "MarkdownNote";
      var viewHtml = isMd
        ? '<div class="ntmd">' + mdToHtml(nt.text) + "</div>"
        : '<pre class="nttext">' + (nt.text ? esc(nt.text) : '<span style="color:#6E7386">（该笔记内容为空）</span>') + "</pre>";
      pane.innerHTML =
        '<div class="dsub"><h3><span class="bar"></span>' + esc(label) + '</h3>' +
        (nt.title ? '<div class="nttitle">' + esc(nt.title) + "</div>" : "") +
        '<div class="nthead">' +
        '<button class="nt-edit">编辑</button><button class="nt-save" style="display:none">保存</button>' +
        '<button class="nt-cancel" style="display:none">取消</button></div>' +
        viewHtml +
        '<textarea class="ntarea" style="display:none" spellcheck="false">' + esc(nt.text || "") + "</textarea></div>";
      var card = pane;
      var viewSel = isMd ? ".ntmd" : ".nttext";
      card.querySelector(".nt-edit").addEventListener("click", function () {
        card.querySelector(viewSel).style.display = "none";
        var ta = card.querySelector(".ntarea");
        ta.style.display = "";
        card.querySelector(".nt-edit").style.display = "none";
        card.querySelector(".nt-save").style.display = "";
        card.querySelector(".nt-cancel").style.display = "";
        ta.focus();
      });
      card.querySelector(".nt-cancel").addEventListener("click", function () {
        card.querySelector(viewSel).style.display = "";
        card.querySelector(".ntarea").style.display = "none";
        card.querySelector(".nt-edit").style.display = "";
        card.querySelector(".nt-save").style.display = "none";
        card.querySelector(".nt-cancel").style.display = "none";
      });
      card.querySelector(".nt-save").addEventListener("click", function () {
        var val = card.querySelector(".ntarea").value;
        fetch("/api/workflow/note", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: path, id: nt.id, text: val })
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.error) throw new Error(d.error);
          var viewEl = card.querySelector(viewSel);
          if (isMd) viewEl.innerHTML = mdToHtml(val); else viewEl.textContent = val;
          viewEl.style.display = "";
          card.querySelector(".ntarea").style.display = "none";
          card.querySelector(".nt-edit").style.display = "";
          card.querySelector(".nt-save").style.display = "none";
          card.querySelector(".nt-cancel").style.display = "none";
          toast("笔记已保存");
        }).catch(function (e) {
          toast("保存失败: " + (e && e.message ? e.message : String(e)), true);
        });
      });
    });
  }

  function bindWfTabs() {
    var tabs = document.querySelectorAll("#wd_body .wdtab");
    if (!tabs.length) return;
    tabs.forEach(function (b) {
      b.addEventListener("click", function () {
        tabs.forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
        var t = b.getAttribute("data-t");
        document.querySelectorAll("#wd_body .wdpane").forEach(function (pn) { pn.style.display = "none"; });
        var target = t === "p" ? $("wdpaneP") : $("wdpaneN" + t.slice(1));
        if (target) target.style.display = "";
      });
    });
  }

  function loadWfRef() {
    var box = $("wfRef");
    if (!box) return;
    var wf = wState.sel;
    if (!wf || !wf.path) {
      box.innerHTML = '<div class="note" style="padding:14px 10px">（选择左侧工作流后显示对应的最近生成结果）</div>';
      return;
    }
    fetch("/api/wf_recent?path=" + encodeURIComponent(wf.path) + "&limit=20").then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.error) throw new Error(d.error);
      var items = d || [];
      if (!items.length) {
        box.innerHTML = '<div class="note" style="padding:14px 10px">（该工作流暂无匹配的生成结果——输出图的节点结构与当前工作流不一致，或图片被后处理丢失了元数据）</div>';
        return;
      }
      wState.refItems = items;
      wState.refIdx = 0;
      renderWfRef();
    }).catch(function (e) {
      box.innerHTML = '<div class="note" style="padding:14px 10px">（匹配失败: ' + esc(e && e.message ? e.message : String(e)) + '）</div>';
    });
  }

  /* 渲染「最近生成结果」：主图 + 信息行 + 历史生成缩略图列表（点击切换主图并联动左侧参数） */
  function renderWfRef() {
    var box = $("wfRef");
    if (!box) return;
    var items = wState.refItems || [];
    if (!items.length) return;
    var i = Math.min(wState.refIdx || 0, items.length - 1);
    var f = items[i];
    var wh = (f.width && f.height) ? '<span style="opacity:.8">' + f.width + ' × ' + f.height + '</span>' : "";
    var more = items.length > 1
      ? '<span style="opacity:.65;font-size:11.5px">· 第 ' + (i + 1) + '/' + items.length + ' 张</span>' : "";
    box.innerHTML = '<div class="rth"><img src="' + mediaUrl(f.path, true) + '" alt=""></div>' +
      '<div class="rinfo"><b>' + esc(f.name) + "</b><span>" + fmtTime(f.mtime) + wh + more + "</span></div>" +
      '<div class="wfhist">' + items.map(function (it, j) {
        return '<span class="whitem' + (j === i ? " on" : "") + '" data-i="' + j + '" title="' + esc(it.name) + '">' +
          '<img src="' + mediaUrl(it.path, true) + '" alt=""></span>';
      }).join("") + "</div>";
    box.querySelector(".rth img").addEventListener("click", function () { openLightbox(f, items); });
    box.querySelectorAll(".whitem").forEach(function (el) {
      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var j = parseInt(el.getAttribute("data-i"), 10);
        wState.refIdx = j;
        renderWfRef();
        loadWfRefMeta(items[j]);
      });
    });
  }

  /* 点击历史生成缩略图：左侧参数区切换为该图的 PNG 元数据（模型/采样器/提示词） */
  function loadWfRefMeta(item) {
    fetch("/api/output_meta?path=" + encodeURIComponent(item.path)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.found || !d.params) { toast("该图没有参数元数据", true); return; }
      var cont = document.querySelector("#wd_body .wfd > div:first-child");
      if (!cont) return;
      renderWfMetaInto(cont, item, d.params);
      toast("已切换为该历史生成的参数");
    }).catch(function () { toast("读取历史图参数失败", true); });
  }

  function renderWfMetaInto(cont, imgItem, p) {
    var dir = imgItem.path;
    var k = String(dir).lastIndexOf("\\");
    var folder = k > 0 ? String(dir).slice(0, k) : dir;
    var left = "";
    var rows = [
      ["文件名", imgItem.name],
      ["生成时间", fmtTime(imgItem.mtime)],
      ["分辨率", (p.width || imgItem.width || "?") + " × " + (p.height || imgItem.height || "?")],
      ["所在文件夹", folder]
    ];
    left += '<div class="dsub"><h3><span class="bar"></span>历史生成 · 文件信息</h3>' + kvHTML(rows) + "</div>";
    var s4 = [];
    if (p.sampler_name != null) s4.push(["采样器", p.sampler_name + (p.scheduler != null ? " + " + p.scheduler : "")]);
    if (p.steps != null) s4.push(["步数 steps", String(p.steps)]);
    if (p.cfg != null) s4.push(["CFG", String(p.cfg)]);
    if (p.seed != null) s4.push(["种子 seed", String(p.seed)]);
    if (p.denoise != null) s4.push(["降噪 denoise", String(p.denoise)]);
    if (s4.length) left += '<div class="dsub" style="margin-top:14px"><h3><span class="bar"></span>采样参数</h3>' + kvHTML(s4) + "</div>";
    var mr = [];
    if (p.unet_name) mr.push(["UNet", p.unet_name]);
    if (p.clip_name) mr.push(["CLIP", p.clip_name]);
    if (p.vae_name) mr.push(["VAE", p.vae_name]);
    if (p.lora_name) mr.push(["LoRA", p.lora_name +
      (p.lora_strength_model != null ? " (model " + p.lora_strength_model + " / clip " + (p.lora_strength_clip != null ? p.lora_strength_clip : "-") + ")" : "")]);
    if (mr.length) left += '<div class="dsub" style="margin-top:14px"><h3><span class="bar"></span>调用模型</h3>' + kvHTML(mr) + "</div>";
    var ph = "";
    if (p.positive) ph += '<div class="minihead" style="margin:6px 0 4px">正向</div>' + promptBlockHTML(p.positive, false);
    if (p.negative) ph += '<div class="minihead" style="margin:10px 0 4px">反向</div>' + promptBlockHTML(p.negative, true);
    if (ph) left += '<div class="dsub" style="margin-top:14px"><h3><span class="bar"></span>提示词</h3>' + ph + "</div>";
    cont.innerHTML = left;
    bindPromptButtons(cont);
  }
  $("w_search").addEventListener("input", debounce(function () {
    wState.q = $("w_search").value.trim();
    loadWorkflows();
  }, 300));
  $("w_sort").addEventListener("change", function () { wState.sort = this.value; loadWorkflows(); });
  $("wf_refresh").addEventListener("click", function () { loadWorkflowFolders(); loadWorkflows(); });
  $("wf_expand").addEventListener("click", function () {
    wState.collapsed = {};
    saveCollapsed("cfm_wf_collapsed", {});
    renderWorkflowFolderTree();
  });
  $("wf_collapse").addEventListener("click", function () {
    wState.collapsed = {};
    collectBranchPaths(wState.wfolders).forEach(function (p) { wState.collapsed[p] = 1; });
    saveCollapsed("cfm_wf_collapsed", wState.collapsed);
    renderWorkflowFolderTree();
  });
  $("w_settings_toggle").addEventListener("click", function () {
    var s = $("wf_settings");
    s.style.display = s.style.display === "none" ? "" : "none";
  });
  $("w_adddir").addEventListener("click", function () {
    var d = $("w_newdir").value.trim();
    if (!d) { toast("请输入目录路径", true); return; }
    if (storageCfg.workflow_dirs.indexOf(d) >= 0) { toast("目录已存在"); return; }
    storageCfg.workflow_dirs.push(d);
    saveStorageConfig().then(function () { renderStorageDirs(); loadWorkflowFolders(); loadWorkflows(); toast("已添加并扫描"); })
      .catch(function (e) { toast(e.message, true); });
  });
  $("wd_open").addEventListener("click", function () {
    if (wState.sel) openFolder(wState.sel.path);
  });
  $("wd_copy").addEventListener("click", function () {
    if (!wState.sel) { toast("请先选择工作流", true); return; }
    fetch("/media?path=" + encodeURIComponent(wState.sel.path)).then(function (r) { return r.text(); }).then(function (t) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(t).then(function () { toast("已复制工作流 JSON"); });
      }
      var ta = document.createElement("textarea");
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      toast("已复制工作流 JSON");
    }).catch(function (e) { toast("复制失败: " + e, true); });
  });
  $("wd_export").addEventListener("click", function () {
    if (!wState.sel) { toast("请先选择工作流", true); return; }
    fetch("/media?path=" + encodeURIComponent(wState.sel.path)).then(function (r) { return r.text(); }).then(function (t) {
      var blob = new Blob([t], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = wState.sel.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast("已导出: " + wState.sel.name);
    }).catch(function (e) { toast("导出失败: " + e, true); });
  });
  $("wd_del").addEventListener("click", function () {
    if (!wState.sel) return;
    var f = wState.sel;
    confirmDelete($("wd_del"), f.path, function () {
      wState.sel = null;
      loadWorkflows();
    });
  });

  /* ================= 栏宽拖拽（输出 / 工作流 三分式） ================= */
  function initSplitter(key, secId, def1, def2, min1, min2) {
    var sec = $(secId);
    if (!sec) return;
    var g1 = sec.querySelector('.grip[data-idx="0"]');
    var g2 = sec.querySelector('.grip[data-idx="1"]');
    if (!g1 || !g2) return;
    var padL = 20, padR = 20, GAP = 16, REMAIN_MIN = 240;
    var skey = "cu_layout_" + key + "_v2";
    var ckey = "cu_layout_" + key + "_col";
    var coll = [false, false];
    var w1 = def1, w2 = def2;
    try {
      var s = JSON.parse(localStorage.getItem(skey) || "null");
      if (s && isFinite(s[0]) && isFinite(s[1])) { w1 = s[0]; w2 = s[1]; }
    } catch (e) {}
    try {
      var cs = JSON.parse(localStorage.getItem(ckey) || "null");
      if (cs && cs.length === 2) { coll[0] = !!cs[0]; coll[1] = !!cs[1]; }
    } catch (e) {}
    if (window.innerWidth <= 1180 && !localStorage.getItem(skey)) {
      w1 = Math.min(w1, 220); w2 = Math.min(w2, 280);
    }
    function secW() {
      var r = sec.getBoundingClientRect();
      return r.width - padL - padR;
    }
    function maxSum() { return secW() - 2 * GAP - REMAIN_MIN; }
    function apply() {
      var a = coll[0] ? 0 : w1;
      var c = coll[1] ? "0px" : "minmax(0,1fr)";
      sec.style.gridTemplateColumns = a + "px " + w2 + "px " + c;
      g1.style.left = (padL + a + GAP / 2 - 4.5) + "px";
      g2.style.left = (padL + a + GAP + w2 + GAP / 2 - 4.5) + "px";
      g1.title = coll[0] ? "展开左栏" : "拖动调整栏宽";
      g2.title = coll[1] ? "展开右栏" : "拖动调整栏宽";
      g1.classList.toggle("collapsed", coll[0]);
      g2.classList.toggle("collapsed", coll[1]);
      var ps = sec.querySelectorAll(".panel");
      if (ps.length >= 3) {
        ps[0].classList.toggle("collapsed", coll[0]);
        ps[ps.length - 1].classList.toggle("collapsed", coll[1]);
      }
    }
    function save() {
      try { localStorage.setItem(skey, JSON.stringify([w1, w2])); } catch (e) {}
    }
    function fit() {
      /* 视图隐藏时（display:none）clientWidth 为 0，不压缩，保持默认宽度 */
      if (sec.clientWidth <= 0) return;
      /* 侧边栏收缩时不做自动压缩 */
      if (coll[0] || coll[1]) { apply(); return; }
      /* 保证第三栏 ≥ REMAIN_MIN：超宽时优先压缩中栏，再压缩左栏 */
      var ms = maxSum();
      if (w1 + w2 > ms) {
        var over = w1 + w2 - ms;
        var cut2 = Math.min(w2 - min2, over);
        w2 -= cut2;
        w1 = Math.max(min1, w1 - (over - cut2));
      }
      apply();
    }
    var rafPending = null;
    function bind(g, isFirst) {
      var dragging = false;
      var x = 0;
      g.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        dragging = true;
        g.classList.add("drag");
        sec.classList.add("dragging");
        try { g.setPointerCapture(e.pointerId); } catch (err) {}
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
      });
      g.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var r = sec.getBoundingClientRect();
        x = e.clientX - r.left - padL;
        /* 按帧节流：同一帧内多次 move 只重排一次，拖拽更跟手 */
        if (rafPending == null) {
          rafPending = requestAnimationFrame(function () {
            rafPending = null;
            var ms = maxSum();
            if (isFirst) w1 = Math.max(min1, Math.min(x - GAP / 2, ms - min2));
            else w2 = Math.max(min2, Math.min(x - w1 - GAP - GAP / 2, ms - w1));
            apply();
          });
        }
      });
      ["pointerup", "pointercancel"].forEach(function (ev) {
        g.addEventListener(ev, function () {
          if (!dragging) return;
          dragging = false;
          g.classList.remove("drag");
          sec.classList.remove("dragging");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
          fit();
          save();
        });
      });
    }
    /* 侧边栏收缩按钮：左栏标题 + 右栏标题 */
    var panels = Array.prototype.filter.call(sec.children, function (c) {
      return c.classList && c.classList.contains("panel");
    });
    if (panels.length >= 3) {
      function mkCollapse(side) {
        var h = side === "L" ? panels[0].querySelector("h2") : panels[panels.length - 1].querySelector("h2");
        if (!h) return;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "colcollapse";
        function upd() {
          b.innerHTML = side === "L" ? (coll[0] ? "⏵" : "⏴") : (coll[1] ? "⏴" : "⏵");
          b.title = side === "L" ? (coll[0] ? "展开左栏" : "收缩左栏") : (coll[1] ? "展开右栏" : "收缩右栏");
        }
        upd();
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          if (side === "L") { coll[0] = !coll[0]; if (!coll[0]) { w1 = def1; } }
          else { coll[1] = !coll[1]; if (!coll[1]) { w2 = def2; } }
          try { localStorage.setItem(ckey, JSON.stringify(coll)); } catch (err) {}
          try { localStorage.setItem(skey, JSON.stringify([w1, w2])); } catch (err) {}
          upd();
          fit();
        });
        h.appendChild(b);
      }
      mkCollapse("L");
      mkCollapse("R");
    }
    bind(g1, true);
    bind(g2, false);
    /* 侧边栏收缩后：点击分隔条展开 */
    function gripExpand(g, idx) {
      g.addEventListener("click", function () {
        if (!coll[idx]) return;
        coll[idx] = false;
        /* 展开时恢复默认宽度（不沿用收缩前的记忆宽度） */
        if (idx === 0) w1 = def1; else w2 = def2;
        try { localStorage.setItem(ckey, JSON.stringify(coll)); } catch (e) {}
        try { localStorage.setItem(skey, JSON.stringify([w1, w2])); } catch (e) {}
        g.classList.remove("drag");
        sec.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        fit();
      });
    }
    gripExpand(g1, 0);
    gripExpand(g2, 1);
    window.addEventListener("resize", fit);
    /* 隐藏视图初始化时宽度为 0，直接用默认宽度，不做压缩 */
    if (sec.clientWidth > 0) fit(); else apply();
  }

  /* 缩略图大小调节（输出管理文件区） */
  var thH = 200;
  try { var _th = parseInt(localStorage.getItem("cu_th_h") || "200", 10); if (isFinite(_th)) thH = _th; } catch (e) {}
  function applyTh(h) {
    thH = Math.max(110, Math.min(320, h));
    document.documentElement.style.setProperty("--th-h", thH + "px");
    try { localStorage.setItem("cu_th_h", String(thH)); } catch (e) {}
  }
  applyTh(thH);

  /* ================= 启动 ================= */
  initSplitter("out", "view-outputs", 300, 330, 170, 230);
  initSplitter("wf", "view-workflows", 380, 360, 170, 230);
  $("healthBadge").addEventListener("click", openComfySetting);
  refreshHealth();
  setInterval(refreshHealth, 10000);
  loadStorageConfig();
  loadOutputFolders();
  loadWorkflowFolders();
  loadWorkflows();
  var bootView = location.hash.replace("#", "");
  if (["outputs", "workflows", "models"].indexOf(bootView) === -1) bootView = "outputs";
  switchView(bootView);
  /* 版本戳：页面与服务端不一致时自动刷新（防止旧页面缓存） */
  try {
    fetch("/api/version").then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.v && PAGE_VER && d.v !== PAGE_VER) {
        toast("检测到新版本，自动刷新…");
        setTimeout(function () { location.reload(true); }, 600);
      }
    }).catch(function () {});
  } catch (e) {}
})();
</script>
